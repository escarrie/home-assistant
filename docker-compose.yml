# Une mailbox = un service. Même image, paramètres différents.
x-mailsync: &mailsync
  build: ./mbsync
  image: mailsync:latest
  restart: unless-stopped
  
  volumes:
    - ./data/mbsync/mail:/data   # chaque service écrit dans ./data/mbsync/mail/<MAILBOX_NAME>/
  tmpfs:
    - /tmp                    # config + mot de passe en RAM, jamais sur le volume
  environment: &mailsync-env
    PUID: "501"               # `id -u` sur ton Mac
    PGID: "20"                # `id -g` sur ton Mac
    TZ: Europe/Brussels

services:
  mail-perso:
    <<: *mailsync
    env_file: ./mbsync/env/.env.perso

  mail-escarrie:
    <<: *mailsync
    env_file: ./mbsync/env/.env.escarrie

  
  mail-pinggame:
    <<: *mailsync
    env_file: ./mbsync/env/.env.pinggame

  # Microsoft 365 : OAuth2. Connexion initiale : docker compose run --rm mail-zenproject authorize
  # mail-zenproject:
  #   <<: *mailsync
  #   env_file: ./mbsync/env/.env.zenproject
  #   volumes:
  #     - ./data/mbsync/mail:/data
  #     - ./data/mbsync/oauth:/oauth   # refresh token, hors du volume lu par mail2md

  # Convertit en Markdown les mails déjà synchronisés, après chaque synchro réussie
  # (surveille data/mbsync/mail/<mailbox>/.mailsync-last-success).
  mail2md:
    build: ./mbsync/mail2md
    image: mail2md:latest
    restart: unless-stopped
    user: "501:20"            # mêmes PUID:PGID que les conteneurs mbsync
    volumes:
      - ./data/mbsync/mail:/data/mail:ro
      - ./data/mbsync/markdown:/data/markdown
    environment:
      TZ: Europe/Brussels
      POLL_INTERVAL: "15"
      # Envoi des nouveaux mails à OpenClaw (webhook de la gateway sur le Mac).
      OPENCLAW_HOOK_URL: http://host.docker.internal:18789/hooks
      PUSH_FOLDERS: INBOX
    # Token du webhook + Telegram, générés par `make install` (absent = envoi désactivé).
    env_file:
      - path: ./mbsync/env/.env.mail2md
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # mail-pro:
  #   <<: *mailsync
  #   env_file: ./mbsync/env/pro.env
  #   environment:
  #     <<: *mailsync-env
  #     SYNC_INTERVAL: "900"    # surcharge possible service par service